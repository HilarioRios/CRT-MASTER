[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/recurso"
  to = "/.netlify/functions/recurso"
  status = 200

# SPA: /school, /school/crt/..., /privacidad resuelven en el cliente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
